[package]
name = "reading-list-whatsapp-proof"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace]

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
diesel = { version = "2.3.11", default-features = false, features = ["sqlite"] }
hex = "0.4"
hkdf = "0.12"
libsqlite3-sys = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
regex = "1"
rusqlite = { version = "0.39", features = ["functions"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
url = "2"
whatsapp-rust = { version = "=0.7.0", default-features = false, features = ["tokio-runtime", "tokio-native", "tokio-transport", "ureq-client"] }
whatsapp-rust-sqlite-storage = { version = "=0.7.0", default-features = false }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = "line-tables-only"
incremental = false
