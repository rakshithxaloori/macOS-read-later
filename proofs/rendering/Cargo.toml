[package]
name = "reading-list-rendering-proof"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
anyhow = "1"
scraper = "0.24"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui = "0.36.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
url = "2"
dom_smoothie = "0.18.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSDictionary", "NSAttributedString", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSView", "NSTextView", "NSScrollView", "NSFont", "NSColor", "NSTextAttachment", "NSTextTable", "NSParagraphStyle", "NSAttributedString", "NSPrintOperation", "NSPrintInfo"] }
objc2-pdf-kit = "0.3"

[profile.dev]
debug = "line-tables-only"
incremental = false
