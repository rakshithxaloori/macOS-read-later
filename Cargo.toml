[package]
name = "macos-read-later"
version = "0.3.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
default-run = "macos-read-later"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["backup", "functions", "blob"] }
libsqlite3-sys = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "net", "io-util"] }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "accesskit", "persistence"] }
egui = "0.36.2"
scraper = "0.24"
dom_smoothie = "0.18.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico", "bmp"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
md-5 = "0.10"
regex = "1"
walkdir = "2"
directories = "6"
rfd = "0.17"
csv = "1"
roxmltree = "0.21"
zip = { version = "4", default-features = false, features = ["deflate"] }
feed-rs = "2"
ammonia = "4"
fs2 = "0.4"
raw-window-handle = "0.6"
async-trait = "0.1"
whatsapp-rust = { version = "=0.7.0", default-features = false, features = ["tokio-runtime", "tokio-native", "tokio-transport", "ureq-client"] }
whatsapp-rust-sqlite-storage = { version = "=0.7.0", default-features = false }
diesel = { version = "2.3.11", features = ["sqlite"] }
hkdf = "0.12"
hex = "0.4"
zeroize = "1"
qrcode = { version = "0.14", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSAttributedString", "NSData", "NSString", "NSThread"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSView", "NSMenu", "NSMenuItem"] }
objc2-pdf-kit = "0.3"
security-framework = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[profile.dev]
# Keep source locations for backtraces without large dependency debug symbols.
debug = "line-tables-only"
incremental = false

[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.md-5]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
